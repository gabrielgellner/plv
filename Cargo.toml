[package]
name = "plv"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.102"
regex = "1"
clap = { version = "4.6.0", features = ["derive"] }
color-eyre = "0.6.3"
crossterm = "0.29.0"
polars = { version = "0.53.0", features = ["lazy", "parquet", "strings", "regex"] }
ratatui = "0.30.0"

# Read the optimization guideline for more details: https://ratatui.rs/recipes/apps/release-your-app/#optimizations
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
